name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [main]

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir deploy
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp ecosystem.config.cjs deploy/

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/*"
          target: "/home/ubuntu/website/releases/${{ github.sha }}"
          strip_components: 1

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail

            # Non-interactive SSH skips .bashrc, so nvm/fnm/npm-global bins are missing from PATH.
            export NVM_DIR="${HOME}/.nvm"
            if [ -s "${NVM_DIR}/nvm.sh" ]; then
              . "${NVM_DIR}/nvm.sh"
            fi
            if command -v fnm >/dev/null 2>&1; then
              eval "$(fnm env)"
            fi
            export PATH="${HOME}/.npm-global/bin:/usr/local/bin:${PATH}"

            if ! command -v pm2 >/dev/null 2>&1; then
              echo "pm2 not found. On the VM run: npm install -g pm2"
              exit 1
            fi

            RELEASE="/home/ubuntu/website/releases/${{ github.sha }}"
            ln -sfn "$RELEASE" /home/ubuntu/website/current
            cp "$RELEASE/ecosystem.config.cjs" /home/ubuntu/website/ecosystem.config.cjs
            pm2 startOrReload /home/ubuntu/website/ecosystem.config.cjs
            pm2 save
            cd /home/ubuntu/website/releases && ls -t | tail -n +4 | xargs -r rm -rf

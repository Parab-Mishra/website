name: Deploy to Oracle Cloud VM

on:
  push:
    branches: [main]

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          mkdir deploy
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy/*"
          target: "/home/ubuntu/website/releases/${{ github.sha }}"
          strip_components: 1

      - name: Activate release and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            RELEASE="/home/ubuntu/website/releases/${{ github.sha }}"
            ln -sfn "$RELEASE" /home/ubuntu/website/current
            pm2 startOrReload /home/ubuntu/website/ecosystem.config.cjs
            pm2 save
            cd /home/ubuntu/website/releases && ls -t | tail -n +4 | xargs -r rm -rf
